version: 2.1

parameters:
  branch:
    type: string
    default: "main"

  packageXmlBase64:
    type: string
    default: ""

  commit_message:
    type: string
    default: "CI: Salesforce metadata sync"

jobs:
  sync:
    docker:
      - image: cimg/node:20.10

    steps:
      - checkout

      # 🔐 Configure GitHub PAT
      - run:
          name: Configure Git to use GitHub PAT
          command: |
            if [ -z "$GH_TOKEN" ]; then
              echo "GH_TOKEN is not set!"
              exit 1
            fi

            git remote remove origin
            git remote add origin https://$GH_TOKEN@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git
            git fetch origin

      # 1️⃣ Checkout / create branch
      - run:
          name: Checkout target branch
          command: |
            BRANCH="<< pipeline.parameters.branch >>"
            echo "Target branch: $BRANCH"

            if git ls-remote --exit-code --heads origin "$BRANCH"; then
              git checkout -B "$BRANCH" "origin/$BRANCH"
            else
              git checkout -b "$BRANCH"
              git push -u origin "$BRANCH"
            fi

      # 2️⃣ Install dependencies
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y jq
            npm install -g @salesforce/cli
            sf --version

      # 3️⃣ Salesforce Auth (JWT FIX)
      - run:
          name: Salesforce Auth
          command: |
           


            sf org login jwt \
              --client-id "$SF_CLIENT_ID" \ 
              --username "$SF_USERNAME" \
              --jwt-key-file server.key \
              --instance-url https://nutanix--naveen.sandbox.my.salesforce.com \
              --alias ciOrg \
              --set-default
              echo "CLIENT_ID length: ${#SF_CLIENT_ID}"
              echo "USERNAME length: ${#SF_USERNAME}"
              echo "INSTANCE_URL: $SF_INSTANCE_URL"


      # 4️⃣ Write package.xml safely
      - run:
          name: Write package.xml
          command: |
            mkdir -p manifest

            if [ -z "<< pipeline.parameters.packageXmlBase64 >>" ]; then
              echo "packageXmlBase64 is empty"
              exit 1
            fi

            echo "<< pipeline.parameters.packageXmlBase64 >>" | tr -d '\n' | base64 -d > manifest/package.xml

      # 5️⃣ Retrieve metadata
      - run:
          name: Retrieve metadata
          command: |
            sf project retrieve start \
              --target-org ciOrg \
              -x manifest/package.xml \
              --ignore-conflicts \
              --wait 10

      # 6️⃣ Commit & Push
      - run:
          name: Commit changes
          command: |
            git config user.name "salesforce-sync-bot"
            git config user.email "salesforce-sync-bot@users.noreply.github.com"

            git add .

            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi

            git commit -m "<< pipeline.parameters.commit_message >>"
            git push origin HEAD

workflows:
  version: 2
  salesforce_metadata_sync:
    jobs:
      - sync