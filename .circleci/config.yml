version: 2.1

parameters:
  branch:
    type: string
    default: "main"

  packageXmlBase64:
    type: string
    default: ""

  commit_message:
    type: string
    default: "CI: Salesforce metadata sync"

jobs:
  sync:
    docker:
      - image: cimg/node:20.10

    steps:
      - checkout

      # 🔐 Configure authenticated Git remote (FIXES exit 128)
      - run:
          name: Configure Git authentication
          command: |
            git remote set-url origin https://$GH_TOKEN@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git

      # 1️⃣ Checkout or create target branch safely
      - run:
          name: Checkout target branch
          command: |
            BRANCH="<< pipeline.parameters.branch >>"
            echo "Target branch: $BRANCH"

            git fetch origin

            if git ls-remote --exit-code --heads origin "$BRANCH"; then
              git checkout "$BRANCH"
              git pull origin "$BRANCH"
            else
              git checkout -b "$BRANCH"
              git push -u origin "$BRANCH"
            fi

      # 2️⃣ Install dependencies
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y jq
            npm install -g @salesforce/cli

      # 3️⃣ Authenticate to Salesforce
      - run:
          name: Salesforce Auth
          command: |
            TOKEN_RESPONSE=$(curl -s https://test.salesforce.com/services/oauth2/token \
              -d "grant_type=password" \
              -d "client_id=$SF_CLIENT_ID" \
              -d "client_secret=$SF_CLIENT_SECRET" \
              -d "username=$SF_USERNAME" \
              -d "password=$SF_PASSWORD")

            ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)
            INSTANCE_URL=$(echo "$TOKEN_RESPONSE" | jq -r .instance_url)

            if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
              echo "Salesforce authentication failed"
              echo "$TOKEN_RESPONSE"
              exit 1
            fi

            echo "$ACCESS_TOKEN" | sf org login access-token \
              --instance-url "$INSTANCE_URL" \
              --alias ciOrg \
              --set-default

      # 4️⃣ Ensure SFDX project exists
      - run:
          name: Ensure SFDX project exists
          command: |
            if [ ! -f sfdx-project.json ]; then
              echo "Creating minimal sfdx-project.json"

              mkdir -p force-app

              printf '{\n' > sfdx-project.json
              printf '  "packageDirectories": [\n' >> sfdx-project.json
              printf '    {\n' >> sfdx-project.json
              printf '      "path": "force-app",\n' >> sfdx-project.json
              printf '      "default": true\n' >> sfdx-project.json
              printf '    }\n' >> sfdx-project.json
              printf '  ],\n' >> sfdx-project.json
              printf '  "namespace": "",\n' >> sfdx-project.json
              printf '  "sourceApiVersion": "59.0"\n' >> sfdx-project.json
              printf '}\n' >> sfdx-project.json
            else
              echo "SFDX project already exists"
            fi

      - run:
          name: Write package.xml
          command: |
            mkdir -p manifest

            if [ -z "<< pipeline.parameters.packageXmlBase64 >>" ]; then
              echo "ERROR: packageXmlBase64 is empty"
              exit 1
            fi

            echo "<< pipeline.parameters.packageXmlBase64 >>" | tr -d '\n' | base64 -d > manifest/package.xml

            echo "Generated package.xml:"
            cat manifest/package.xml

            # Validate XML before Salesforce call
            if ! grep -q "<Package" manifest/package.xml; then
              echo "ERROR: Invalid XML generated"
              exit 1
            fi


      # 6️⃣ Retrieve metadata
      - run:
          name: Retrieve metadata
          command: |
            sf project retrieve start \
              --target-org ciOrg \
              -x manifest/package.xml \
              --ignore-conflicts \
              --wait 10

      # 7️⃣ Commit & push changes
      - run:
          name: Commit Salesforce metadata
          command: |
            git config user.name "salesforce-sync-bot"
            git config user.email "salesforce-sync-bot@users.noreply.github.com"

            git add force-app sfdx-project.json manifest || true

            if git diff --cached --quiet; then
              echo "No Salesforce metadata changes detected"
              exit 0
            fi

            git commit -m "<< pipeline.parameters.commit_message >>"
            git push origin HEAD

workflows:
  version: 2
  salesforce_metadata_sync:
    jobs:
      - sync
